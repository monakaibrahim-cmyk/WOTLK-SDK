name: Build & Package Windows Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tag_info
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag) { $tag = "${{ github.event.release.tag_name }}" }
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if (-not $tag) { $tag = "v1.0.0" }
          Write-Host "Determined release tag: $tag"
          "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake (Win32 x86)
        shell: pwsh
        run: |
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-x86" `
            -G "Visual Studio 17 2022" -A Win32 -T host=x64 `
            -DWOTLK_SDK_BUILD_EXAMPLES=ON

      - name: Build Debug & Release Static Libraries
        shell: pwsh
        run: |
          # Build Win32 x86 Debug configuration
          Write-Host "Building Win32 x86 Debug configuration..."
          cmake --build "${{ github.workspace }}/build-x86" --config Debug --parallel

          # Build Win32 x86 Release configuration
          Write-Host "Building Win32 x86 Release configuration..."
          cmake --build "${{ github.workspace }}/build-x86" --config Release --parallel

      - name: Package SDK Distribution Archive
        shell: pwsh
        run: |
          $tag = "${{ steps.tag_info.outputs.TAG }}"
          $staging = "${{ github.workspace }}/staging"

          # Create directory structure for Static SDK distribution
          New-Item -ItemType Directory -Force -Path "$staging/include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/lib/Debug" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/lib/Release" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/lib/x86/Debug" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/lib/x86/Release" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/examples/bin/Debug" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/examples/bin/Release" | Out-Null

          # 1. Copy Public Headers & Subsystem Interfaces
          Copy-Item "${{ github.workspace }}/include/*" "$staging/include" -Recurse -Force
          Copy-Item "${{ github.workspace }}/tools/HOOK-KIT" "$staging/include/HOOK-KIT" -Recurse -Force
          Copy-Item "${{ github.workspace }}/tools/HOOK-KIT/MinHook/include/MinHook.h" "$staging/include/" -Force
          Copy-Item "${{ github.workspace }}/tools/HOOK-KIT/asmjit/asmjit" "$staging/include/asmjit" -Recurse -Force
          Copy-Item "${{ github.workspace }}/deps/unordered_dense/include/*" "$staging/include" -Recurse -Force

          # 2. Copy Static SDK Libraries (WotlkSDK.lib & dependencies)
          # Win32 (x86) Debug
          if (Test-Path "${{ github.workspace }}/build-x86/bin/Debug/WotlkSDK.lib") {
            Copy-Item "${{ github.workspace }}/build-x86/bin/Debug/WotlkSDK.lib" "$staging/lib/Debug/" -Force
            Copy-Item "${{ github.workspace }}/build-x86/bin/Debug/WotlkSDK.lib" "$staging/lib/x86/Debug/" -Force
          }
          if (Test-Path "${{ github.workspace }}/build-x86/bin/Debug/MinHook.lib") {
            Copy-Item "${{ github.workspace }}/build-x86/bin/Debug/MinHook.lib" "$staging/lib/Debug/" -Force
            Copy-Item "${{ github.workspace }}/build-x86/bin/Debug/MinHook.lib" "$staging/lib/x86/Debug/" -Force
          }
          if (Test-Path "${{ github.workspace }}/build-x86/bin/Debug/asmjit.lib") {
            Copy-Item "${{ github.workspace }}/build-x86/bin/Debug/asmjit.lib" "$staging/lib/Debug/" -Force
            Copy-Item "${{ github.workspace }}/build-x86/bin/Debug/asmjit.lib" "$staging/lib/x86/Debug/" -Force
          }
          Get-ChildItem -Path "${{ github.workspace }}/build-x86/bin/Debug" -Filter "*.pdb" | ForEach-Object {
            Copy-Item $_.FullName "$staging/lib/Debug/" -Force
            Copy-Item $_.FullName "$staging/lib/x86/Debug/" -Force
          }

          # Win32 (x86) Release
          if (Test-Path "${{ github.workspace }}/build-x86/bin/Release/WotlkSDK.lib") {
            Copy-Item "${{ github.workspace }}/build-x86/bin/Release/WotlkSDK.lib" "$staging/lib/Release/" -Force
            Copy-Item "${{ github.workspace }}/build-x86/bin/Release/WotlkSDK.lib" "$staging/lib/x86/Release/" -Force
          }
          if (Test-Path "${{ github.workspace }}/build-x86/bin/Release/MinHook.lib") {
            Copy-Item "${{ github.workspace }}/build-x86/bin/Release/MinHook.lib" "$staging/lib/Release/" -Force
            Copy-Item "${{ github.workspace }}/build-x86/bin/Release/MinHook.lib" "$staging/lib/x86/Release/" -Force
          }
          if (Test-Path "${{ github.workspace }}/build-x86/bin/Release/asmjit.lib") {
            Copy-Item "${{ github.workspace }}/build-x86/bin/Release/asmjit.lib" "$staging/lib/Release/" -Force
            Copy-Item "${{ github.workspace }}/build-x86/bin/Release/asmjit.lib" "$staging/lib/x86/Release/" -Force
          }
          Get-ChildItem -Path "${{ github.workspace }}/build-x86/bin/Release" -Filter "*.pdb" | ForEach-Object {
            Copy-Item $_.FullName "$staging/lib/Release/" -Force
            Copy-Item $_.FullName "$staging/lib/x86/Release/" -Force
          }

          # 3. Copy Sample Mod DLLs (Demonstrating custom mod consumers)
          if (Test-Path "${{ github.workspace }}/build-x86/bin/Debug/SampleMod.dll") {
            Copy-Item "${{ github.workspace }}/build-x86/bin/Debug/SampleMod.dll" "$staging/examples/bin/Debug/" -Force
          }
          if (Test-Path "${{ github.workspace }}/build-x86/bin/Debug/SampleModC.dll") {
            Copy-Item "${{ github.workspace }}/build-x86/bin/Debug/SampleModC.dll" "$staging/examples/bin/Debug/" -Force
          }
          if (Test-Path "${{ github.workspace }}/build-x86/bin/Release/SampleMod.dll") {
            Copy-Item "${{ github.workspace }}/build-x86/bin/Release/SampleMod.dll" "$staging/examples/bin/Release/" -Force
          }
          if (Test-Path "${{ github.workspace }}/build-x86/bin/Release/SampleModC.dll") {
            Copy-Item "${{ github.workspace }}/build-x86/bin/Release/SampleModC.dll" "$staging/examples/bin/Release/" -Force
          }

          # 4. Copy Documentation, Manifest & Licenses
          Copy-Item "${{ github.workspace }}/README.md" "$staging/" -Force
          Copy-Item "${{ github.workspace }}/LICENSE" "$staging/" -Force
          Copy-Item "${{ github.workspace }}/vcpkg.json" "$staging/" -Force
          Copy-Item "${{ github.workspace }}/licenses" "$staging/licenses" -Recurse -Force

          # 5. Create Distribution Zip Archive
          $zipName = "WotlkSDK_$tag.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath "${{ github.workspace }}/$zipName" -Force
          Write-Host "Created release distribution archive: $zipName"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/WotlkSDK_*.zip
          tag_name: ${{ steps.tag_info.outputs.TAG }}
          name: WotlkSDK ${{ steps.tag_info.outputs.TAG }}
          body: |
            ## WotlkSDK Release ${{ steps.tag_info.outputs.TAG }}
            Software Development Kit for World of Warcraft 3.3.5a (Build 12340).

            ### Architecture: Static Library Only (Win32 / x86)
            WotlkSDK is distributed exclusively as a static library (`WotlkSDK.lib`). Dynamic DLLs are reserved for consumer mods and custom loaders, eliminating external runtime DLL distribution requirements.

            World of Warcraft 3.3.5a (build 12340) is natively a 32-bit Win32 client application. WotlkSDK is compiled strictly for 32-bit (x86) MSVC runtime.

            ### Included Static Builds
            - **Release Configurations** (`/MT` statically linked MSVC runtime):
              - Static SDK: `lib/Release/WotlkSDK.lib` (`lib/x86/Release/WotlkSDK.lib`)
              - Dependent static libraries: `MinHook.lib`, `asmjit.lib`
              - Sample Mods: `SampleMod.dll` (Modern C++23) & `SampleModC.dll` (Pure C)
            - **Debug Configurations** (`/MTd` with full debug symbols & PDBs):
              - Static SDK: `lib/Debug/WotlkSDK.lib` (`lib/x86/Debug/WotlkSDK.lib`)
              - Dependent static libraries: `MinHook.lib`, `asmjit.lib`
              - Sample Mods: `SampleMod.dll` & `SampleModC.dll`
            - **Headers & Includes**:
              - `<WOTLK-SDK/wotlkcpp.h>` (Modern C++23 entrypoint)
              - `<WOTLK-SDK/wotlkc.h>` (Native pure C entrypoint)
              - Subsystems: Threaded Discord Social SDK, HOOK-KIT, Auto-Login, and reverse-engineered engine registries.
              - Standardized dependencies: `<HOOK-KIT/...>`, `<ankerl/unordered_dense.h>`, `<MinHook.h>`, `<asmjit/...>`
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
