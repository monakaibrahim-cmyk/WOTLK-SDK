name: Build & Package Windows Release

on:
  push:
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release version tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        id: tag_info
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag_name }}"
          if (-not $tag) { $tag = "${{ github.event.release.tag_name }}" }
          if (-not $tag -and "${{ github.ref_type }}" -eq "tag") { $tag = "${{ github.ref_name }}" }
          if (-not $tag) { $tag = "v1.0.0" }
          Write-Host "Determined release tag: $tag"
          "TAG=$tag" >> $env:GITHUB_OUTPUT

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Configure CMake Projects
        shell: pwsh
        run: |
          # 1. Win32 Static (Debug & Release)
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-x86-static" `
            -G "Visual Studio 17 2022" -A Win32 -T host=x64 `
            -DBUILD_SHARED_LIBS=OFF -DWOTLK_SDK_BUILD_EXAMPLES=ON

          # 2. Win32 Shared (Debug & Release)
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-x86-shared" `
            -G "Visual Studio 17 2022" -A Win32 -T host=x64 `
            -DBUILD_SHARED_LIBS=ON -DWOTLK_SDK_BUILD_EXAMPLES=ON

          # 3. x64 Static (Debug & Release)
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-x64-static" `
            -G "Visual Studio 17 2022" -A x64 -T host=x64 `
            -DBUILD_SHARED_LIBS=OFF -DWOTLK_SDK_BUILD_EXAMPLES=OFF

          # 4. x64 Shared (Debug & Release)
          cmake -S "${{ github.workspace }}" -B "${{ github.workspace }}/build-x64-shared" `
            -G "Visual Studio 17 2022" -A x64 -T host=x64 `
            -DBUILD_SHARED_LIBS=ON -DWOTLK_SDK_BUILD_EXAMPLES=OFF

      - name: Build Debug & Release Configurations
        shell: pwsh
        run: |
          # Build Win32 Static (Debug + Release)
          cmake --build "${{ github.workspace }}/build-x86-static" --config Debug --parallel
          cmake --build "${{ github.workspace }}/build-x86-static" --config Release --parallel

          # Build Win32 Shared (Debug + Release)
          cmake --build "${{ github.workspace }}/build-x86-shared" --config Debug --parallel
          cmake --build "${{ github.workspace }}/build-x86-shared" --config Release --parallel

          # Build x64 Static (Debug + Release)
          cmake --build "${{ github.workspace }}/build-x64-static" --config Debug --parallel
          cmake --build "${{ github.workspace }}/build-x64-static" --config Release --parallel

          # Build x64 Shared (Debug + Release)
          cmake --build "${{ github.workspace }}/build-x64-shared" --config Debug --parallel
          cmake --build "${{ github.workspace }}/build-x64-shared" --config Release --parallel

      - name: Package SDK Distribution Archive
        shell: pwsh
        run: |
          $tag = "${{ steps.tag_info.outputs.TAG }}"
          $staging = "${{ github.workspace }}/staging"

          # Directory hierarchy for Multi-Arch Debug and Release
          New-Item -ItemType Directory -Force -Path "$staging/include" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/lib/x86/Debug" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/lib/x86/Release" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/lib/x64/Debug" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/lib/x64/Release" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/bin/x86/Debug" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/bin/x86/Release" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/bin/x64/Debug" | Out-Null
          New-Item -ItemType Directory -Force -Path "$staging/bin/x64/Release" | Out-Null

          # Copy Public Headers
          Copy-Item "${{ github.workspace }}/include/*" "$staging/include" -Recurse -Force
          Copy-Item "${{ github.workspace }}/tools/HOOK-KIT" "$staging/include/HOOK-KIT" -Recurse -Force

          # Copy Static Libraries (.lib)
          # x86
          if (Test-Path "${{ github.workspace }}/build-x86-static/bin/Debug/WotlkSDK.lib") {
            Copy-Item "${{ github.workspace }}/build-x86-static/bin/Debug/WotlkSDK.lib" "$staging/lib/x86/Debug/" -Force
          }
          if (Test-Path "${{ github.workspace }}/build-x86-static/bin/Release/WotlkSDK.lib") {
            Copy-Item "${{ github.workspace }}/build-x86-static/bin/Release/WotlkSDK.lib" "$staging/lib/x86/Release/" -Force
          }
          # x64
          if (Test-Path "${{ github.workspace }}/build-x64-static/bin/Debug/WotlkSDK.lib") {
            Copy-Item "${{ github.workspace }}/build-x64-static/bin/Debug/WotlkSDK.lib" "$staging/lib/x64/Debug/" -Force
          }
          if (Test-Path "${{ github.workspace }}/build-x64-static/bin/Release/WotlkSDK.lib") {
            Copy-Item "${{ github.workspace }}/build-x64-static/bin/Release/WotlkSDK.lib" "$staging/lib/x64/Release/" -Force
          }

          # Copy Shared Binaries (.dll, .pdb, sample mods)
          # x86 Debug
          Get-ChildItem -Path "${{ github.workspace }}/build-x86-shared/bin/Debug" -Include *.dll,*.pdb -Recurse | Copy-Item -Destination "$staging/bin/x86/Debug/" -Force
          # x86 Release
          Get-ChildItem -Path "${{ github.workspace }}/build-x86-shared/bin/Release" -Include *.dll,*.pdb -Recurse | Copy-Item -Destination "$staging/bin/x86/Release/" -Force
          # x64 Debug
          Get-ChildItem -Path "${{ github.workspace }}/build-x64-shared/bin/Debug" -Include *.dll,*.pdb -Recurse | Copy-Item -Destination "$staging/bin/x64/Debug/" -Force
          # x64 Release
          Get-ChildItem -Path "${{ github.workspace }}/build-x64-shared/bin/Release" -Include *.dll,*.pdb -Recurse | Copy-Item -Destination "$staging/bin/x64/Release/" -Force

          # Copy Documentation, Manifest & Licenses
          Copy-Item "${{ github.workspace }}/README.md" "$staging/" -Force
          Copy-Item "${{ github.workspace }}/LICENSE" "$staging/" -Force
          Copy-Item "${{ github.workspace }}/vcpkg.json" "$staging/" -Force
          Copy-Item "${{ github.workspace }}/licenses" "$staging/licenses" -Recurse -Force

          # Create Distribution Zip Archive
          $zipName = "WotlkSDK_$tag.zip"
          Compress-Archive -Path "$staging/*" -DestinationPath "${{ github.workspace }}/$zipName" -Force
          Write-Host "Created release distribution archive: $zipName"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ github.workspace }}/WotlkSDK_*.zip
          tag_name: ${{ steps.tag_info.outputs.TAG }}
          name: WotlkSDK ${{ steps.tag_info.outputs.TAG }}
          body: |
            ## WotlkSDK Release ${{ steps.tag_info.outputs.TAG }}
            Software Development Kit for World of Warcraft 3.3.5a (Build 12340).

            ### Included Builds
            - **Release Configurations** (`/MT` static runtime):
              - Static Libraries: `lib/x86/Release/WotlkSDK.lib` & `lib/x64/Release/WotlkSDK.lib`
              - Shared DLLs & Symbols: `bin/x86/Release/WotlkSDK.dll` (+ `.pdb`)
              - Sample Mods: `SampleMod.dll` (C++23) & `SampleModC.dll` (Pure C)
            - **Debug Configurations** (`/MTd` with full symbols):
              - Static Libraries: `lib/x86/Debug/WotlkSDK.lib` & `lib/x64/Debug/WotlkSDK.lib`
              - Shared DLLs & Symbols: `bin/x86/Debug/WotlkSDK.dll` (+ `.pdb`)
              - Sample Mods: `SampleMod.dll` & `SampleModC.dll`
            - **Headers**:
              - `<WOTLK-SDK/wotlkcpp.h>` (Modern C++23 entrypoint)
              - `<WOTLK-SDK/wotlkc.h>` (Native pure C entrypoint)
              - Subsystems: Threaded Discord Social SDK, HOOK-KIT, Auto-Login, and engine registries.
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
